<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redirecionando — {{FROM_ID}} · Noos</title>
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#f7fbf9" />
<link rel="canonical" href="{{CANONICAL_URL}}" />
<meta http-equiv="refresh" content="0; url={{DESTINY_PATH}}" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<style>
  /* Página de redirect (spec-pagina-de-questao.md, revisão v10.2 — plano C).
     Mínima por desenho: zero CSS/fontes externas — o redirect é instantâneo;
     este estilo só vira visível se o refresh for bloqueado. */
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.6 "Instrument Sans", system-ui, -apple-system, sans-serif;
         background: #f7fbf9; color: #17241f; }
  @media (prefers-color-scheme: dark) {
    body { background: #0c1512; color: #e8f2ec; }
  }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
          font-size: .85rem; opacity: .7; }
  code { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
         font-size: .9em; }
  .dest { font-size: 1.05rem; word-break: break-all; }
  .note { font-size: .9rem; opacity: .75; }
</style>
</head>
<body>
<main>
  <p class="mono">noos.study</p>
  <h1>Este endereço antigo mudou</h1>
  <p>A questão <code>{{FROM_ID}}</code> vive agora em:</p>
  <p class="dest"><a href="{{DESTINY_PATH}}">{{DESTINY_PATH}}</a></p>
  <p class="note">Redirecionando… — se nada acontecer, use o link acima.</p>
</main>
<script>location.replace('{{DESTINY_PATH}}');</script>
</body>
</html>
