name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate-placeholders:
    name: Gate de placeholders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Regra do projeto: nenhuma página pode ir ao ar com dados do
      # mantenedor em aberto (Revisão do Time — Estado Atual, P0).
      # Enquanto este job estiver vermelho, o site NÃO está pronto.
      - name: Nenhuma página com EDITAR/EDIT vivo
        run: |
          if grep -rnE 'EDITAR|EDIT' index.html 404.html pt/index.html en/index.html; then
            echo "::error::Ainda há placeholders EDITAR/EDIT nas páginas. Preencha os dados do mantenedor (README, seção «Preencher antes do ir ao ar»), remova os comentários <!-- EDITAR/EDIT ... --> e faça push de novo."
            exit 1
          fi
          echo "OK — nenhum placeholder vivo."

  integridade:
    name: Integridade e paridade PT/EN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Paridade de âncoras e seções (PT ↔ EN)
        run: |
          diff <(grep -oE 'id="[a-zA-Z-]+"' pt/index.html | sort) \
               <(grep -oE 'id="[a-zA-Z-]+"' en/index.html | sort)

      - name: Paridade de metas sociais (PT ↔ EN)
        run: |
          pt=$(grep -c 'property="og:' pt/index.html)
          en=$(grep -c 'property="og:' en/index.html)
          if [ "$pt" -ne "$en" ]; then
            echo "::error::PT tem $pt metas og:, EN tem $en — as duas línguas são cidadãs de primeira classe."
            exit 1
          fi

      - name: Referências locais existem
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path('.')
          bad = []
          pages = ['index.html', '404.html', 'pt/index.html', 'en/index.html']
          for page in pages:
              html = (root / page).read_text(encoding='utf-8')
              for m in re.finditer(r'(?:href|src)="(/[^"#]*)(?:[#?].*)?"', html):
                  ref = m.group(1)
                  cand = root / (ref.lstrip('/') + 'index.html') if ref.endswith('/') else root / ref.lstrip('/')
                  if not cand.exists():
                      bad.append(f'{page} -> {ref}')
          if bad:
              for b in bad:
                  print(f'::error::referência quebrada: {b}')
              sys.exit(1)
          print('OK — todas as referências locais existem.')
          PY

      - name: Sitemap cobre PT e EN
        run: |
          grep -q 'https://noos.study/pt/' sitemap.xml
          grep -q 'https://noos.study/en/' sitemap.xml

  sdd-lint:
    name: SDD — arquivos canônicos e registro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Regra do projeto: o SDD mora no repositório (problema, decisão,
      # limites e evidência no Git — não em conversa). Este job guarda a
      # existência dos arquivos canônicos e a sincronia do registro.
      - name: Arquivos canônicos do SDD presentes
        run: |
          for f in constitution.md current-state.md plan.md noos.registry.json; do
            test -f "$f" || { echo "::error::$f ausente — o SDD mora no repositório (ver README)."; exit 1; }
          done
          grep -q "noos.registry.json" README.md || { echo "::error::README não aponta o registro (noos.registry.json)."; exit 1; }

      - name: Registro válido e em sincronia com o site
        run: |
          python3 - <<'PY'
          import json
          reg = json.load(open('noos.registry.json', encoding='utf-8'))
          ns = reg['namespaces']
          canon = {'em produção', 'em breve', 'no horizonte', 'descontinuado'}
          prefixes = [n['prefix'] for n in ns]
          assert len(prefixes) == len(set(prefixes)) == 5, 'esperava 5 prefixos únicos'
          for n in ns:
              assert n['status'] in canon, f"status não canônico: {n['app']} = {n['status']}"
          assert reg['library']['name'] == '@ironidesflj/axon', 'registro deve apontar @ironidesflj/axon'
          version = reg['version']
          for lang in ('pt', 'en'):
              html = open(f'{lang}/index.html', encoding='utf-8').read()
              for n in ns:
                  assert n['app'] in html, f"{n['app']} ausente em {lang}/index.html"
              assert f'v{version}' in html, f"rodapé {lang} sem a versão v{version} do registro"
          print(f'OK — registro v{version} válido e em sincronia com PT e EN.')
          PY
